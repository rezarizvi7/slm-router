services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # Uncomment on a machine with an NVIDIA GPU + nvidia-container-toolkit:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  # One-shot: pull the SLM and the embedding model, then exit.
  ollama-pull:
    image: ollama/ollama:0.12.6
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "ollama pull ${ROUTER_LOCAL_MODEL:-qwen2.5:1.5b-instruct} && ollama pull ${ROUTER_EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  redis:
    image: redis:8.0.3  # Redis 8 bundles the query engine (FT.* / HNSW vectors)
    ports: ["6379:6379"]

  router:
    build: .
    depends_on:
      redis: { condition: service_started }
      ollama-pull: { condition: service_completed_successfully }
    env_file: [{ path: .env, required: false }]
    environment:
      ROUTER_LOCAL_BASE_URL: http://ollama:11434/v1
      ROUTER_EMBED_BASE_URL: http://ollama:11434
      ROUTER_REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  ollama:
