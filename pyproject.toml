[project]
name = "slm-router"
version = "0.1.0"
description = "Local reverse proxy that routes LLM prompts between a small local model and a frontier API by complexity, with a semantic cache."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.3",
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
slm-router = "slm_router.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_router"]

[tool.setuptools.package-data]
slm_router = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
